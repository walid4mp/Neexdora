name: Release

# CI proves a change is safe. CD ships it. Keeping them in one file is how
# you end up building a signed release bundle on every pull request.
on:
  # push:
  #   tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      build_type:
        description: "Artifact to produce"
        required: true
        default: aab
        type: choice
        options: [aab, apk, both]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.44.3"

jobs:
  release:
    name: Build signed artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Create a GitHub Environment named `production` and add a required
    # reviewer. That is what stops an accidental tag push from shipping.
    # environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Re-run the gates. A tag can point at any commit, including one that
      # never went through a PR.
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

      - name: Validate required release secrets
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          FIREBASE_OPTIONS_DART_BASE64: ${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}
          DART_DEFINE_ENV_PROD_BASE64: ${{ secrets.DART_DEFINE_ENV_PROD_BASE64 }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          missing=0
          for name in GOOGLE_SERVICES_JSON_BASE64 FIREBASE_OPTIONS_DART_BASE64 DART_DEFINE_ENV_PROD_BASE64 ANDROID_KEYSTORE_BASE64 ANDROID_STORE_PASSWORD ANDROID_KEY_PASSWORD ANDROID_KEY_ALIAS; do
            if [ -z "${!name}" ]; then echo "::error::Missing GitHub secret: $name"; missing=1; fi
          done
          [ "$missing" -eq 0 ]

      - name: Restore Firebase config
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          FIREBASE_OPTIONS_DART_BASE64: ${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}
        run: |
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          echo "$FIREBASE_OPTIONS_DART_BASE64" | base64 --decode > lib/firebase_options.dart
          python - <<'PY'
          import json
          with open("android/app/google-services.json", encoding="utf-8") as f:
              data = json.load(f)
          project_id = data.get("project_info", {}).get("project_id", "")
          if not project_id or "your-" in project_id or "000000000000" in project_id:
              raise SystemExit("Invalid placeholder Firebase configuration")
          PY
          if grep -Eq "REPLACE_WITH_YOUR|your-firebase-project-id|000000000000" lib/firebase_options.dart; then
            echo "::error::Firebase options contain placeholder values."
            exit 1
          fi

      - name: Restore dart-define file
        env:
          DART_DEFINE_ENV_BASE64: ${{ secrets.DART_DEFINE_ENV_PROD_BASE64 }}
        run: echo "$DART_DEFINE_ENV_BASE64" | base64 -d > ci.env

      # The app Gradle file reads these exact property names from android/key.properties.
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          test -s android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Resolve version
        id: version
        run: |
          RAW="${GITHUB_REF_NAME#v}"
          echo "app_version=${RAW:-0.0.0}" >> "$GITHUB_OUTPUT"

      - name: Build App Bundle
        if: inputs.build_type != 'apk'
        run: |
          flutter build appbundle --release \
            --dart-define-from-file=ci.env \
            --dart-define=APP_ENV=production \
            --dart-define=APP_VERSION=${{ steps.version.outputs.app_version }} \
            --dart-define=BUILD_NUMBER=${GITHUB_RUN_NUMBER} \
            --dart-define=COMMIT_SHA=${GITHUB_SHA::7}

      - name: Build split APKs
        if: inputs.build_type != 'aab'
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define-from-file=ci.env \
            --dart-define=APP_ENV=production \
            --dart-define=APP_VERSION=${{ steps.version.outputs.app_version }} \
            --dart-define=BUILD_NUMBER=${GITHUB_RUN_NUMBER} \
            --dart-define=COMMIT_SHA=${GITHUB_SHA::7}

      - name: Clean up secrets
        if: always()
        run: |
          rm -f ci.env android/key.properties android/app/upload-keystore.jks
          rm -f android/app/google-services.json lib/firebase_options.dart

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/app/outputs/bundle/release/*.aab
            build/app/outputs/flutter-apk/*.apk

      # NOT IMPLEMENTED ON PURPOSE — Play Store upload.
      # It needs a service-account JSON with Play Developer API access. I
      # have no evidence that account exists, and inventing the step would
      # produce a workflow that fails on its first real run. Add Fastlane's
      # `supply` action here once the account is provisioned; see
      # docs/ci-cd.md for why Fastlane is NOT recommended before that point.
