name: Release (APK / AAB)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "What to build"
        required: true
        default: both
        type: choice
        options: [apk, aab, both]
      version_name:
        description: "Version name (leave empty to use pubspec.yaml)"
        required: false
        type: string
  push:
    tags: ["v*.*.*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.3" # must satisfy pubspec.lock (>=3.44.0)
  JAVA_VERSION: "21"

jobs:
  release:
    name: Build signed release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BUILD_TYPE: ${{ inputs.build_type || 'both' }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
      GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Validate required secrets (release needs the keystore too)
        run: scripts/ci/validate_secrets.sh release

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ inputs.version_name }}" ]; then V="${{ inputs.version_name }}";
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}";
          else V="$(grep -E '^version:' pubspec.yaml | sed -E 's/version:\s*([0-9.]+).*/\1/')"; fi
          echo "app_version=$V" >> "$GITHUB_OUTPUT"
          echo "Building version $V (build number ${GITHUB_RUN_NUMBER})"

      - name: Prepare build inputs
        env:
          APP_VERSION: ${{ steps.version.outputs.app_version }}
          BUILD_NUMBER: ${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
        run: scripts/ci/prepare_build.sh release

      - run: flutter pub get

      - name: Build split-per-ABI APKs
        if: env.BUILD_TYPE == 'apk' || env.BUILD_TYPE == 'both'
        run: |
          flutter build apk --release --split-per-abi \
            --build-name="${{ steps.version.outputs.app_version }}" --build-number="${GITHUB_RUN_NUMBER}" \
            --dart-define-from-file=ci.env.json

      - name: Build universal APK
        if: env.BUILD_TYPE == 'apk' || env.BUILD_TYPE == 'both'
        run: |
          flutter build apk --release \
            --build-name="${{ steps.version.outputs.app_version }}" --build-number="${GITHUB_RUN_NUMBER}" \
            --dart-define-from-file=ci.env.json

      - name: Build AAB (Google Play)
        if: env.BUILD_TYPE == 'aab' || env.BUILD_TYPE == 'both'
        run: |
          flutter build appbundle --release \
            --build-name="${{ steps.version.outputs.app_version }}" --build-number="${GITHUB_RUN_NUMBER}" \
            --dart-define-from-file=ci.env.json

      - name: Verify APKs (integrity, signature, manifest) + checksums
        if: env.BUILD_TYPE == 'apk' || env.BUILD_TYPE == 'both'
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          cd build/app/outputs/flutter-apk
          for f in *.apk; do
            echo "=== $f"
            unzip -tq "$f" | tail -1
            "$BT/apksigner" verify --verbose --print-certs "$f" | grep -E "^Verifies|scheme|SHA-256 digest" || { echo "::error::$f failed signature verification"; exit 1; }
            "$BT/aapt2" dump badging "$f" > /tmp/badging.txt
            grep -E "^package:|^sdkVersion|^targetSdkVersion|^native-code" /tmp/badging.txt | cut -c1-120
            grep -q "name='com.nexora.app'" /tmp/badging.txt || { echo "::error::$f has an unexpected package name"; exit 1; }
          done
          sha256sum *.apk | tee sha256sums.txt

      - name: Upload APKs
        if: env.BUILD_TYPE == 'apk' || env.BUILD_TYPE == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: nexora-release-apks
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/flutter-apk/sha256sums.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload AAB
        if: env.BUILD_TYPE == 'aab' || env.BUILD_TYPE == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: nexora-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Clean up secret files
        if: always()
        run: scripts/ci/cleanup.sh
