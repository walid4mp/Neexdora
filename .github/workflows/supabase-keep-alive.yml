name: Supabase keep-alive

on:
  schedule:
    - cron: "17 5 */3 * *" # every 3 days — prevents free-tier projects from pausing
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase REST
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error title=Missing secrets::Add SUPABASE_URL and SUPABASE_ANON_KEY repository secrets."; exit 1; fi
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/app_system_control?select=id&limit=1")
          echo "HTTP $code"
          [ "$code" = "200" ] || { echo "::error::Supabase did not answer 200 (got $code). Check the URL/key and that migrations were applied."; exit 1; }
