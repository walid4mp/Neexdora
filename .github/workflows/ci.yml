name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_debug_apk:
        description: "Also build a debug APK"
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # pubspec.lock requires Flutter >=3.44.0 / Dart >=3.12.0 — keep these two in sync.
  FLUTTER_VERSION: "3.44.3"
  JAVA_VERSION: "21" # android/app/build.gradle.kts compiles with JavaVersion.VERSION_21

jobs:
  quality:
    name: Format · Analyze · Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Show toolchain
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      - name: Unit & widget tests
        run: flutter test --reporter expanded

  build-debug-apk:
    name: Debug APK
    needs: quality
    # Runs on pushes (secrets are not available to fork PRs) and manual runs with the checkbox. Never skipped silently:
    # if secrets are missing the job FAILS with the list of missing secret names.
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.build_debug_apk)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
      GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Validate required secrets
        run: scripts/ci/validate_secrets.sh debug

      - name: Prepare build inputs
        env:
          APP_VERSION: 1.0.0
          BUILD_NUMBER: ${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
        run: scripts/ci/prepare_build.sh debug

      - run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug --dart-define-from-file=ci.env.json

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nexora-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Clean up secret files
        if: always()
        run: scripts/ci/cleanup.sh
