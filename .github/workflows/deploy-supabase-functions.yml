
name: Deploy Supabase Edge Functions

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase-functions.yml"

permissions:
  contents: read

concurrency:
  group: supabase-edge-functions-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Nexora Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.58.5

      - name: Verify deployment secret
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing SUPABASE_ACCESS_TOKEN"
            exit 1
          fi

      - name: Deploy Nexora Edge Functions
        run: |
          supabase functions deploy send-notification --project-ref uroontxrqsebzsnevevo --yes
          supabase functions deploy generate-livekit-token --project-ref uroontxrqsebzsnevevo --yes
          supabase functions deploy ai-gateway --project-ref uroontxrqsebzsnevevo --yes
          supabase functions deploy delete-media-asset --project-ref uroontxrqsebzsnevevo --yes
          supabase functions deploy link-preview --project-ref uroontxrqsebzsnevevo --yes
          supabase functions deploy sync-reels --project-ref uroontxrqsebzsnevevo --yes
          supabase functions deploy admin-action --project-ref uroontxrqsebzsnevevo --yes
