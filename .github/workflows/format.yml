name: Format Dart sources

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to format"
        required: true
        default: "main"
        type: string

permissions:
  contents: write

concurrency:
  group: format-${{ inputs.branch }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.44.3"

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify analyzer package resolution
        run: python3 tool/validate_pub_config.py

      - name: Format Dart files
        run: dart format .

      - name: Commit formatting changes
        run: |
          if [ -n "$(git status --porcelain -- '*.dart')" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- '*.dart'
            git commit -m "Format Dart sources with Flutter 3.44.3"
            git push origin "HEAD:${{ inputs.branch }}"
          else
            echo "All Dart files are already formatted."
          fi
